min_version = "2026.10.7"

[settings]
lockfile = true

[tool_config]
locked = true

[env]
GOTOOLCHAIN = "local"

[tools]
"aqua:casey/just" = "1.58.0"
"aqua:hashicorp/terraform" = "1.15.8"
"aqua:golangci/golangci-lint" = "2.12.2"
"aqua:mvdan/gofumpt" = "0.11.0"
"aqua:gotestyourself/gotestsum" = "1.13.0"
"aqua:google/osv-scanner" = "2.5.0"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:jqlang/jq" = "1.8.2"
"aqua:google/yamlfmt" = "0.21.0"
"aqua:mvdan/sh" = "3.13.1"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:tombi-toml/tombi" = "1.4.0"

[tools."http:go"]
version = "1.26.10"
bin_path = "go/bin"

[tools."http:go".platforms]
linux-x64 = { url = "https://go.dev/dl/go1.26.10.linux-amd64.tar.gz", checksum = "sha256:ccfe7ae822d2c2f41f4fe7c956199967a4dac22d0ee0d2b2bfdb440aab3b20c5" }

[tools."github:go-gremlins/gremlins"]
version = "0.6.0"

[tools."github:go-gremlins/gremlins".platforms]
linux-x64 = { asset_pattern = "gremlins_0.6.0_linux_amd64.tar.gz" }

[tools."github:woodruffw/zizmor"]
version = "1.29.0"

[tools."github:woodruffw/zizmor".platforms]
linux-x64 = { asset_pattern = "zizmor-x86_64-unknown-linux-gnu.tar.gz" }
