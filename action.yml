# The tf-mut GitHub Action (M3d.2, issue #52; comment removal in M4, issue
# #64), under the trust and failure-order contract: capture the run's exit
# code with the documented non-blocking pattern, then upload SARIF, then exit
# with the captured code. The markdown summary goes to the job step summary —
# the PR comment and its `pull-requests: write` ask were removed so adoption's
# permission ask is minimal. See ACTION.md for the permission,
# fork-degradation and distribution contract.
name: tf-mut
description: >-
  Mutation testing for terraform test. Runs tf-mut over the pull request, uploads SARIF annotations, and writes the markdown summary to the job step summary — and the check outcome is the run's own exit code, whatever the uploads manage.
author: andrewesweet
inputs:
  version:
    description: >-
      The tf-mut release version to install (for example v0.3.0). Required: the Action never resolves "latest" — an unpinned tool in CI is an unverified tool.
    required: true
  args:
    description: Arguments passed to `tf-mut run` after the module path.
    required: false
    default: "--since origin/${{ github.base_ref || 'master' }}"
  module:
    description: The module directory to mutate.
    required: false
    default: "."
  download-base-url:
    description: >-
      Base URL for release assets. The default is this repository's releases; overriding it is for mirrors and for this repository's own workflow test. Checksum verification applies wherever the assets come from.
    required: false
    default: "https://github.com/andrewesweet/tf-mut/releases/download"
  sarif-category:
    description: >-
      Category for the code-scanning upload. GitHub permits one upload per job per tool/category, so a workflow invoking this Action more than once in a job must give each invocation its own category. Empty means uncategorised.
    required: false
    default: ""
outputs:
  exit-code:
    description: The tf-mut run's own exit code, before any upload ran.
    value: ${{ steps.run.outputs.exit_code }}
  sarif-outcome:
    description: >-
      The SARIF upload step's outcome (success/failure/skipped) — the degradation contract made observable, so a caller can assert that a read-only token degraded rather than silently vanished.
    value: ${{ steps.sarif.outcome }}
runs:
  using: composite
  steps:
    - name: Install tf-mut from the checksummed release asset
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        BASE_URL: ${{ inputs.download-base-url }}
      # The logic lives in scripts/action-install, under the repository's
      # shared shell parse, format and lint gates.
      run: '"$GITHUB_ACTION_PATH/scripts/action-install"'
    - name: Run tf-mut and capture the exit code
      id: run
      shell: bash
      env:
        MODULE: ${{ inputs.module }}
        RUN_ARGS: ${{ inputs.args }}
      # The documented non-blocking pattern lives in scripts/action-run,
      # under the shared shell gates: the run's exit code is captured, the
      # uploads happen either way, and the final step exits with this code.
      run: '"$GITHUB_ACTION_PATH/scripts/action-run"'
    - name: Upload SARIF
      id: sarif
      # Degrades gracefully: a fork or Dependabot PR carries a read-only
      # token, the upload is skipped or fails without consequence, and the
      # check outcome is preserved by the final step.
      uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3.37.7
      continue-on-error: true
      with:
        sarif_file: tf-mut.sarif
        category: ${{ inputs.sarif-category }}
    - name: Exit with the captured code
      shell: bash
      env:
        EXIT_CODE: ${{ steps.run.outputs.exit_code }}
      run: |
        set -euo pipefail
        echo "tf-mut exited $EXIT_CODE; uploads ran with their own outcomes"
        exit "$EXIT_CODE"
