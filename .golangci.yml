version: "2"
run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
linters:
  default: all
  disable:
    # These enforce incompatible layout conventions; goimports and gofumpt own layout.
    - nlreturn
    - wsl
    - wsl_v5
    # The v2 replacement is enabled; running both produces duplicate policy findings.
    - gomodguard
    # The project exposes concrete behavior rather than repository-wide interface returns.
    - ireturn
    # Short local names are idiomatic in tests and small command adapters.
    - varnamelen
    # Report and configuration values are constructed field-by-field where a
    # zero value is the documented default; requiring every field at every call
    # site hides which fields the caller actually chose.
    - exhaustruct
    # `if err := f(); err != nil` is the canonical Go form and is used throughout.
    - noinlineerr
    # Errors crossing this repository's own package boundaries are already
    # domain errors with sentinels; re-wrapping them at every internal hop adds
    # noise without adding context.
    - wrapcheck
    # revive's confusing-results asks for named results where two results share
    # a type; the two linters cannot both be satisfied, and the named form reads
    # better at the call site.
    - nonamedreturns
  settings:
    govet:
      enable-all: true
      disable:
        # Field order in the report schema and the discovery inventories follows
        # the domain, not the allocator; packing them by size would obscure it.
        - fieldalignment
    depguard:
      rules:
        main:
          list-mode: lax
          allow:
            - $gostd
            - github.com/andrewesweet/tf-mut
            - pgregory.net/rapid
            # Terraform's own parser and value library: settled in
            # docs/research/03-hcl2-tooling.md, and the reason the tool can
            # mutate configurations without diverging from Terraform's grammar.
            - github.com/hashicorp/hcl/v2
            - github.com/zclconf/go-cty
        context-boundary:
          list-mode: lax
          files:
            - "**/internal/fingerprint/**"
            - "**/internal/oracle/**"
            - "**/internal/mutation/**"
            - "**/internal/discovery/**"
            - "**/internal/tfexec/**"
            - "**/internal/sandbox/**"
            # The last two contexts to enter the rule: the Suggestion and
            # Characterisation contexts own their status vocabularies, and the
            # application layer projects them onto the published DTOs. The
            # package globs cover their test files too — there is no !$test
            # escape hatch, so an adapter test cannot name a publication DTO
            # any more than the adapters can.
            - "**/internal/suggest/**"
            - "**/internal/characterise/**"
          deny:
            - pkg: github.com/andrewesweet/tf-mut/internal/report
              desc: "Publication DTOs are an outer context; preserve the dependency direction in CONTEXT.md."
        # #89, second rule: native syntax is the boundary's own dialect. Only
        # the four packages below may name `hclsyntax` — discovery as the
        # expression boundary the other contexts read through, mutation and
        # characterise as the two rewrite-and-generation contexts whose
        # operators own their tokens, config because `.tf-mut.hcl` is its own
        # format. Every other consumer reads expression facts through
        # discovery's published accessors; the engine's test files are bound
        # by this like any other file.
        hclsyntax-boundary:
          list-mode: lax
          files:
            - $all
            - "!**/internal/discovery/**"
            - "!**/internal/mutation/**"
            - "!**/internal/characterise/**"
            - "!**/internal/config/**"
          deny:
            - pkg: github.com/hashicorp/hcl/v2/hclsyntax
              desc: "Native syntax is parsed and walked inside the boundary (discovery, mutation, characterise) and by config's own format; go through discovery's accessors. See ADR-0004."
        # #89, third rule: core, supporting and Terraform Boundary packages
        # cannot import the application layer or CLI. The engine coordinates
        # these contexts and the CLI coordinates the engine; reverse imports
        # from the packages below fail lint.
        application-boundary:
          list-mode: lax
          files:
            - "**/internal/fingerprint/**"
            - "**/internal/oracle/**"
            - "**/internal/mutation/**"
            - "**/internal/discovery/**"
            - "**/internal/tfexec/**"
            - "**/internal/sandbox/**"
            - "**/internal/suggest/**"
            - "**/internal/characterise/**"
          deny:
            - pkg: github.com/andrewesweet/tf-mut/internal/engine
              desc: "The engine is the application layer; a context never imports it. See CONTEXT.md's dependency direction."
            - pkg: github.com/andrewesweet/tf-mut/cmd
              desc: "The CLI is an outer adapter; a context never imports it. See CONTEXT.md's dependency direction."
        # #89, fourth rule: the Terraform Boundary is the value-type floor of
        # the map. Its packages hand canonical facts upward and import no core
        # or supporting context. Boundary-to-boundary imports stay allowed;
        # only the five packages below fail lint.
        terraform-boundary:
          list-mode: lax
          files:
            - "**/internal/discovery/**"
            - "**/internal/tfexec/**"
            - "**/internal/sandbox/**"
          deny:
            - pkg: github.com/andrewesweet/tf-mut/internal/fingerprint
              desc: "The Terraform Boundary imports no core context. See CONTEXT.md's dependency direction."
            - pkg: github.com/andrewesweet/tf-mut/internal/oracle
              desc: "The Terraform Boundary imports no core context. See CONTEXT.md's dependency direction."
            - pkg: github.com/andrewesweet/tf-mut/internal/mutation
              desc: "The Terraform Boundary imports no supporting context. See CONTEXT.md's dependency direction."
            - pkg: github.com/andrewesweet/tf-mut/internal/suggest
              desc: "The Terraform Boundary imports no supporting context. See CONTEXT.md's dependency direction."
            - pkg: github.com/andrewesweet/tf-mut/internal/characterise
              desc: "The Terraform Boundary imports no supporting context. See CONTEXT.md's dependency direction."
        # #89, fifth rule: report DTOs flow outward — the application layer
        # projects into them and the CLI renders them — so every package
        # except those two denies the publication. This generalises the #89
        # context-boundary rule above from the six contexts to the whole
        # module; the overlap is deliberate, because each rule records a
        # different edge of the same policy. internal/report's own files are
        # governed by report-leaf below, which is the only rule that may admit
        # the package's own external test files.
        publication-boundary:
          list-mode: lax
          files:
            - $all
            - "!**/internal/engine/**"
            - "!**/cmd/tf-mut/**"
            - "!**/internal/report/**"
          deny:
            - pkg: github.com/andrewesweet/tf-mut/internal/report
              desc: "Only the application layer and the CLI read the publication. See CONTEXT.md's dependency direction."
        # #89, sixth rule: internal/report is the stdlib-only publication leaf
        # and imports nothing from this module.
        report-leaf:
          list-mode: strict
          files:
            - "**/internal/report/**"
          allow:
            - $gostd
            - github.com/andrewesweet/tf-mut/internal/report$
          deny:
            - pkg: github.com/andrewesweet/tf-mut
              desc: "internal/report is the stdlib-only publication leaf; it imports nothing from this module. See CONTEXT.md's dependency direction."
    cyclop:
      # Matched to revive's cyclomatic setting below. A complete dispatch over
      # Terraform's grammar — every top-level block kind, every reference form,
      # every mutant state — is legibly complex, not accidentally complex, and
      # the default of 10 rejects the switch statements that express it.
      max-complexity: 25
    funlen:
      # The engine's entry point and the sandbox walk are linear sequences of
      # named steps; splitting them further would trade one readable function
      # for several that only exist to satisfy a line count.
      lines: 90
      statements: 60
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
    tagliatelle:
      case:
        rules:
          # The JSON on both sides of this tool is Terraform's convention:
          # snake_case in, snake_case out.
          json: snake
    revive:
      enable-all-rules: true
      rules:
        # Canonical Go formatters intentionally do not enforce a hard source width.
        - name: line-length-limit
          disabled: true
        # Terraform's grammar has more than five block kinds and the report
        # schema has more than five documented values; the cap is arbitrary here.
        - name: max-public-structs
          disabled: true
        # Every literal 0 and 1 becoming a named constant makes arithmetic
        # harder to read, and the JSON and HCL vocabularies are already named.
        - name: add-constant
          disabled: true
        # Booleans that select a documented contract (read-only lock file,
        # hardlink sharing) are part of those contracts, not hidden coupling.
        - name: flag-parameter
          disabled: true
        # The one explicit collection is the memory-gate harness establishing a
        # collected baseline heap before measuring; a per-line suppression for
        # it proved machine-dependent under nolintlint (revive's rule
        # activation differs across environments), so the rule is disabled
        # here, deterministically, with this as the recorded reason.
        - name: call-to-gc
          disabled: true
        # A parser dispatching over a fixed grammar is legibly complex; the
        # default of 7 rejects any complete switch over Terraform's block types.
        # These three thresholds are raised for that reason and match cyclop
        # and funlen above; they are not disabled.
        - name: cognitive-complexity
          arguments: [25]
        - name: cyclomatic
          arguments: [25]
        - name: function-length
          arguments: [80, 120]
  exclusions:
    generated: strict
    rules:
      # gosec's G703 taint analysis activates for writeFile's fixture-copy
      # path only under some build-tag sets, so the required //nolint:gosec is
      # "used" under one tag set and "unused" under the other — the same
      # machine-dependent activation that got call-to-gc its deterministic
      # disable above. The suppression stays; nolintlint's unused-directive
      # check is excluded for this one file, deterministically, with this as
      # the recorded reason.
      - path: internal/engine/harness_test\.go
        linters:
          - nolintlint
      # The validation-function table is a contract about expressions and is
      # tested package-internally, which is AGENTS.md's fifth recorded testing
      # exception. It needs the unexported evaluator it is a contract about;
      # an external test package could only reach it by exporting the seam,
      # which would widen the exception rather than honour it.
      - path: internal/characterise/functions_test\.go
        linters:
          - testpackage
      # "TODO" is a domain noun in the characterisation vocabulary: a TODO is
      # the tool's name for a judgement point it refuses to guess at, with an
      # identifier, a status vocabulary and a command surface of its own.
      # godox cannot tell a named entity from a leftover marker, so it is
      # excluded for the files that define and drive the entity.
      - path: (internal/report/characterise|internal/characterise/.*|internal/engine/characterise)\.go
        linters:
          - godox
      # SARIF 2.1.0 names its members in camelCase. The repository's snake_case
      # convention governs documents this project designs; this one is a
      # published specification, and renaming its members would be a defect.
      - path: internal/report/sarif\.go
        linters:
          - tagliatelle
formatters:
  enable: []
