version: "2"
run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
linters:
  default: all
  disable:
    # These enforce incompatible layout conventions; goimports and gofumpt own layout.
    - nlreturn
    - wsl
    - wsl_v5
    # The v2 replacement is enabled; running both produces duplicate policy findings.
    - gomodguard
    # The project exposes concrete behavior rather than repository-wide interface returns.
    - ireturn
    # Short local names are idiomatic in tests and small command adapters.
    - varnamelen
  settings:
    govet:
      enable-all: true
    depguard:
      rules:
        main:
          list-mode: lax
          allow:
            - $gostd
            - github.com/andrewesweet/tf-mut
            - pgregory.net/rapid
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
    revive:
      enable-all-rules: true
      rules:
        # Canonical Go formatters intentionally do not enforce a hard source width.
        - name: line-length-limit
          disabled: true
  exclusions:
    generated: strict
formatters:
  enable: []
