version: "2"
run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
linters:
  default: all
  disable:
    # These enforce incompatible layout conventions; goimports and gofumpt own layout.
    - nlreturn
    - wsl
    - wsl_v5
    # The v2 replacement is enabled; running both produces duplicate policy findings.
    - gomodguard
    # The project exposes concrete behavior rather than repository-wide interface returns.
    - ireturn
    # Short local names are idiomatic in tests and small command adapters.
    - varnamelen
    # Report and configuration values are constructed field-by-field where a
    # zero value is the documented default; requiring every field at every call
    # site hides which fields the caller actually chose.
    - exhaustruct
    # `if err := f(); err != nil` is the canonical Go form and is used throughout.
    - noinlineerr
    # Errors crossing this repository's own package boundaries are already
    # domain errors with sentinels; re-wrapping them at every internal hop adds
    # noise without adding context.
    - wrapcheck
    # revive's confusing-results asks for named results where two results share
    # a type; the two linters cannot both be satisfied, and the named form reads
    # better at the call site.
    - nonamedreturns
  settings:
    govet:
      enable-all: true
      disable:
        # Field order in the report schema and the discovery inventories follows
        # the domain, not the allocator; packing them by size would obscure it.
        - fieldalignment
    depguard:
      rules:
        main:
          list-mode: lax
          allow:
            - $gostd
            - github.com/andrewesweet/tf-mut
            - pgregory.net/rapid
            # Terraform's own parser and value library: settled in
            # docs/research/03-hcl2-tooling.md, and the reason the tool can
            # mutate configurations without diverging from Terraform's grammar.
            - github.com/hashicorp/hcl/v2
            - github.com/zclconf/go-cty
    cyclop:
      # Matched to revive's cyclomatic setting below. A complete dispatch over
      # Terraform's grammar — every top-level block kind, every reference form,
      # every mutant state — is legibly complex, not accidentally complex, and
      # the default of 10 rejects the switch statements that express it.
      max-complexity: 25
    funlen:
      # The engine's entry point and the sandbox walk are linear sequences of
      # named steps; splitting them further would trade one readable function
      # for several that only exist to satisfy a line count.
      lines: 90
      statements: 60
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
    tagliatelle:
      case:
        rules:
          # The JSON on both sides of this tool is Terraform's convention:
          # snake_case in, snake_case out.
          json: snake
    revive:
      enable-all-rules: true
      rules:
        # Canonical Go formatters intentionally do not enforce a hard source width.
        - name: line-length-limit
          disabled: true
        # Terraform's grammar has more than five block kinds and the report
        # schema has more than five documented values; the cap is arbitrary here.
        - name: max-public-structs
          disabled: true
        # Every literal 0 and 1 becoming a named constant makes arithmetic
        # harder to read, and the JSON and HCL vocabularies are already named.
        - name: add-constant
          disabled: true
        # Booleans that select a documented contract (read-only lock file,
        # hardlink sharing) are part of those contracts, not hidden coupling.
        - name: flag-parameter
          disabled: true
        # A parser dispatching over a fixed grammar is legibly complex; the
        # default of 7 rejects any complete switch over Terraform's block types.
        # These three thresholds are raised for that reason and match cyclop
        # and funlen above; they are not disabled.
        - name: cognitive-complexity
          arguments: [25]
        - name: cyclomatic
          arguments: [25]
        - name: function-length
          arguments: [80, 120]
  exclusions:
    generated: strict
    rules:
      # SARIF 2.1.0 names its members in camelCase. The repository's snake_case
      # convention governs documents this project designs; this one is a
      # published specification, and renaming its members would be a defect.
      - path: internal/report/sarif\.go
        linters:
          - tagliatelle
formatters:
  enable: []
