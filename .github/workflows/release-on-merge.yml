# The merge-driven release trigger (F1, retro-11-flow): pushes to master
# request the next patch release through the tag-driven release pipeline,
# so merged changes reach a published release without a manual tag. The
# pipeline itself (release.yml) stays the only publisher and its gate,
# packaging, checksum and rebuild jobs are unchanged in substance. This
# workflow only decides the version, creates the tag, and calls the
# pipeline: a tag created with the default token would not start a workflow,
# so instead of pushing the tag and hoping, it calls release.yml directly
# with the version as an input. The Go build-chain helper behind
# scripts/next-patch-version decides the version. The concurrency group
# keeps one running and one pending run. A later merge supersedes a pending
# run; its changes ship in the next merge's release. Each retained run
# recomputes from current tags. An existing tag at HEAD is reused until its
# release is published.
name: release-on-merge
on:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: release-on-merge
  cancel-in-progress: false
env:
  GOTOOLCHAIN: local
  MISE_LOCKED: "1"
  MISE_CONFIG_DIR: ${{ github.workspace }}/.artifacts/mise-config
  MISE_CACHE_DIR: ${{ github.workspace }}/.artifacts/cache/mise
jobs:
  tag:
    name: Tag the next patch release
    runs-on: ubuntu-24.04
    permissions:
      contents: write # The release tag — this workflow's only write.
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The decision reads every release tag and the commit each names.
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.7
          install: true
          cache: false
      - name: Decide the next patch version
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if version=$(scripts/next-patch-version); then
            printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"
          else
            code=$?
            if [[ $code -eq 2 ]]; then
              echo "The tag at HEAD already has a published release; nothing to release."
              exit 0
            fi
            exit "$code"
          fi
      - name: Create the release tag
        if: steps.next.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          if ! git show-ref --verify --quiet "refs/tags/$VERSION"; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$VERSION" -f "sha=$GITHUB_SHA"
          fi
  release:
    name: Run the release pipeline
    needs: tag
    if: needs.tag.outputs.version != ''
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.tag.outputs.version }}
    permissions:
      # The pipeline narrows this itself: its workflow-level declaration
      # keeps every job but the publication at read, and only the publish
      # job writes the release.
      contents: write # Letting the called pipeline publish the release.
