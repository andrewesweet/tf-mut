name: codeql
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: "43 4 * * 2"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      actions: read # Read workflow metadata when analyzing GitHub Actions.
      contents: read
      packages: read # Resolve packages used by the analyzed code.
      security-events: write # Upload CodeQL results to code scanning.
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - if: matrix.language == 'go'
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          version: 2026.8.6
          install: true
          cache: true
      - uses: github/codeql-action/init@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
      - if: matrix.language == 'go'
        run: mise exec -- just build
      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: /language:${{ matrix.language }}
