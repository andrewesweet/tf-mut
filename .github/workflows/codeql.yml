name: codeql
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: "43 4 * * 2"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      actions: read # Read workflow metadata when analyzing GitHub Actions.
      contents: read
      packages: read # Resolve packages used by the analyzed code.
      security-events: write # Upload CodeQL results to code scanning.
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.language == 'go'
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.7
          install: true
          cache: true
          # mise-v1 caches predate the checksums mise-action 5.2.4+ stores in the cache.
          cache_key_prefix: mise-v2
      - uses: github/codeql-action/init@0911ee96d2d6c8def97122c36c5cadd93829a4b4 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
      - if: matrix.language == 'go'
        run: mise exec -- just build
      - uses: github/codeql-action/analyze@0911ee96d2d6c8def97122c36c5cadd93829a4b4 # v4
        with:
          category: /language:${{ matrix.language }}
