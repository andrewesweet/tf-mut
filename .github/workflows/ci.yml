name: build-chain
on:
  pull_request:
  push:
    branches: [master]
  # The release pipeline (release-it ticket T4) re-runs this gate for a
  # pushed v* tag before anything is published.
  workflow_call:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      run_real_infrastructure:
        description: Run explicitly guarded integration and performance tests
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  GOTOOLCHAIN: local
  MISE_LOCKED: "1"
  MISE_CONFIG_DIR: ${{ github.workspace }}/.artifacts/mise-config
  MISE_CACHE_DIR: ${{ github.workspace }}/.artifacts/cache/mise
jobs:
  quality:
    name: Quality
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.7
          install: false
          cache: true
      - name: Install exact locked tools
        run: |
          mise install --yes
          mise exec -- just tools-install
      - name: Run local-equivalent quality gate
        run: mise exec -- just ci
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-${{ github.run_id }}
          path: .artifacts/
          include-hidden-files: true
  race:
    name: Race detector
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_call'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.7
          install: false
          cache: true
      - name: Install exact locked tools
        run: |
          mise install --yes
          mise exec -- just tools-install
      - run: mise exec -- just test-race
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: race-${{ github.run_id }}
          path: .artifacts/test/
          include-hidden-files: true
  security:
    name: Security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.7
          install: false
          cache: true
      - name: Install exact locked tools
        run: |
          mise install --yes
          mise exec -- just tools-install
      - run: mise exec -- just security
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-${{ github.run_id }}
          path: .artifacts/security/
          include-hidden-files: true
  mutation-diff:
    name: Mutation diff
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_call'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.7
          install: false
          cache: true
      - name: Install exact locked tools
        run: |
          mise install --yes
          mise exec -- just tools-install
      - name: Run bounded report-only diff mutation
        env:
          EVENT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="$EVENT_BASE"
          # The release pipeline's call arrives as a tag push, whose event
          # carries the zero SHA as `before`; the meaningful diff base is
          # then the tagged commit's parent.
          if [[ ! $base =~ ^[0-9a-f]{40}$ || $base =~ ^0{40}$ ]]; then
            base=$(git rev-parse HEAD^)
          fi
          mise exec -- just mutate-diff "$base"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-${{ github.run_id }}
          path: .artifacts/mutation/
          include-hidden-files: true
  full:
    name: Full scheduled gate
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.7
          install: false
          cache: true
      - name: Install exact locked tools
        run: |
          mise install --yes
          mise exec -- just tools-install
      - run: mise exec -- just ci-full
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-${{ github.run_id }}
          path: .artifacts/
          include-hidden-files: true
  real-infrastructure:
    name: Real infrastructure
    if: github.event_name == 'workflow_dispatch' && inputs.run_real_infrastructure
    runs-on: ubuntu-24.04
    environment: real-infrastructure
    env:
      TF_MUT_ALLOW_REAL_INFRASTRUCTURE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.7
          install: false
          cache: true
      - name: Install exact locked tools
        run: |
          mise install --yes
          mise exec -- just tools-install
      - run: mise exec -- just test-integration
      - run: mise exec -- just test-performance
