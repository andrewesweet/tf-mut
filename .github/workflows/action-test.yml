# The workflow-level test of the tf-mut Action (M3d.2, issue #52): the
# failure-order contract, the checksum gate, and the simulated read-only-token
# degradation, each exercised against a release layout built from this
# checkout and served over file:// — checksum verification applies to it
# exactly as it would to a real release.
name: action-test
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  GOTOOLCHAIN: local
  TEST_VERSION: v0.0.0-test
jobs:
  package:
    name: Package a local release layout
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          version: 2026.8.6
          install: true
          cache: true
      - name: Package the checkout as release assets
        run: just package-test-release "$TEST_VERSION" "$PWD/release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tf-mut-test-release
          path: release
          retention-days: 1
  contract:
    name: Failure order and checksum gate
    needs: package
    runs-on: ubuntu-24.04
    # The Action's documented least-privilege caller permissions, so the
    # publication effects — SARIF upload and PR comment — are assertable.
    permissions:
      contents: read
      security-events: write # The SARIF upload the contract job asserts.
      pull-requests: write # The maintained PR comment the contract job asserts.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tf-mut-test-release
          path: /tmp/tf-mut-release
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Prepare the fixture modules
        run: |
          set -euo pipefail
          cp -r internal/engine/testdata/all-killed /tmp/module
          # The failing-path fixture: the same module with its assertion
          # weakened so mutants survive and the run exits nonzero.
          cp -r internal/engine/testdata/all-killed /tmp/failing
          cat > /tmp/failing/tests/unit.tftest.hcl <<'WEAK'
          run "weak" {
            command = plan

            assert {
              condition     = output.tier != "impossible"
              error_message = "cannot fail"
            }
          }
          WEAK
          # The corruption fixture: a real release layout whose archive bytes
          # are flipped after the checksums were taken.
          cp -r /tmp/tf-mut-release /tmp/tf-mut-corrupt
          printf 'corrupted' >> "/tmp/tf-mut-corrupt/$TEST_VERSION/tf-mut_${TEST_VERSION}_linux_amd64.tar.gz"
      - name: Run the Action against the local release
        id: action
        uses: ./
        with:
          version: v0.0.0-test
          download-base-url: file:///tmp/tf-mut-release
          module: /tmp/module
          args: ""
          comment: "false"
      - name: The check outcome is the captured exit code
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          set -euo pipefail
          test "$EXIT_CODE" = "0"
          test -s tf-mut.sarif
          # Isolate the red invocation's assertions from this run's outputs.
          rm -f tf-mut.sarif tf-mut-summary.md
      - name: A failing run still publishes before the check goes red
        id: failing
        continue-on-error: true
        uses: ./
        with:
          version: v0.0.0-test
          download-base-url: file:///tmp/tf-mut-release
          module: /tmp/failing
          args: ""
          comment: "true"
      - name: The failure order held for the red run
        env:
          FAILING_OUTCOME: ${{ steps.failing.outcome }}
          FAILING_EXIT: ${{ steps.failing.outputs.exit-code }}
          SARIF_OUTCOME: ${{ steps.failing.outputs.sarif-outcome }}
          COMMENT_OUTCOME: ${{ steps.failing.outputs.comment-outcome }}
        run: |
          set -euo pipefail
          # The composite failed — with the run's own findings exit code,
          # captured before the uploads — and the freshly produced SARIF and
          # summary prove the publication path survived the red run.
          test "$FAILING_OUTCOME" = "failure"
          test "$FAILING_EXIT" = "1"
          test -s tf-mut.sarif
          test -s tf-mut-summary.md
          # Under the documented write permissions the publication steps
          # themselves succeeded after the red run.
          test "$SARIF_OUTCOME" = "success"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test "$COMMENT_OUTCOME" = "success"
          fi
      - name: The comment effect is visible on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --jq '[.[] | select(.body | startswith("<!-- tf-mut-report -->"))] | length' |
            grep -qv '^0$'
      - name: A corrupted release asset fails the install
        id: corrupted
        continue-on-error: true
        uses: ./
        with:
          version: v0.0.0-test
          download-base-url: file:///tmp/tf-mut-corrupt
          module: /tmp/module
          args: ""
          comment: "false"
      - name: The checksum gate refused the corrupted asset
        env:
          CORRUPT_OUTCOME: ${{ steps.corrupted.outcome }}
        run: |
          set -euo pipefail
          # The archive exists and downloads; its bytes no longer match the
          # published checksums, and nothing unverified executed.
          test "$CORRUPT_OUTCOME" = "failure"
  degradation:
    name: Read-only token degradation
    needs: package
    runs-on: ubuntu-24.04
    # The simulated fork shape: no security-events write, no pull-requests
    # write. The uploads degrade; the check outcome must survive.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tf-mut-test-release
          path: /tmp/tf-mut-release
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Prepare an offline fixture module
        run: |
          set -euo pipefail
          cp -r internal/engine/testdata/all-killed /tmp/module
      - name: Run the Action under the degraded token
        id: degraded
        uses: ./
        with:
          version: v0.0.0-test
          download-base-url: file:///tmp/tf-mut-release
          module: /tmp/module
          args: ""
      - name: The degraded run preserves the check outcome
        env:
          EXIT_CODE: ${{ steps.degraded.outputs.exit-code }}
          SARIF_OUTCOME: ${{ steps.degraded.outputs.sarif-outcome }}
          COMMENT_OUTCOME: ${{ steps.degraded.outputs.comment-outcome }}
        run: |
          set -euo pipefail
          # The check outcome is the run's own, and the publication steps
          # demonstrably degraded rather than succeeding on a read-only
          # token: the comment step must not have completed a write, and the
          # SARIF step must not have uploaded.
          test "$EXIT_CODE" = "0"
          test "$SARIF_OUTCOME" != "success"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test "$COMMENT_OUTCOME" != "success"
          fi
