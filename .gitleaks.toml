title = "tf-mut secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Generated tool, cache, and artifact directories"
paths = [
  '''^\.artifacts/''',
  '''^\.tools/''',
  '''^research/spikes/.*/\.terraform/''',
]

[[allowlists]]
description = "The sensitive-answer fixture's value, which exists to prove a supplied secret reaches Terraform and no report field"
paths = [
  '''^internal/engine/todos_test\.go$''',
]
regexes = [
  '''tok-0123abcd''',
]
